[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.2",
    "neo4j>=6.3.1",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "packaging>=26.3",
    "pathspec>=1.1.1",
    "pydantic>=2.13.5",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pydriller>=2.12",
    "pymcdm>=1.4.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0.54",
    "structlog>=26.1.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
cp = [
    "ruptures>=1.1.10",
]
rag = [
    "chromadb>=1.5.9",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "gitpython>=3.2.1",
    "httpx>=0.28.1",
    "hypothesis>=6.169.0",
    "mypy>=2.4.0",
    "pymannkendall>=1.4.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "scipy-stubs>=1.18.1.1",
    "statsmodels>=0.15.0",
    "types-jsonschema>=4.26.0.20261006",
    "types-networkx>=3.6.1.20261006",
    "types-pyyaml>=6.0.12.20260906",
]
# Degradation scoring (C4): heavy libraries for explanation, evaluation and the
# LambdaMART comparator. `uv sync --group scoring-ml`.
scoring-ml = [
    "faiss-cpu>=1.15.1",
    "krippendorff>=0.9.0",
    "lightgbm>=4.7.0",
    "pandas>=3.0.6",
    "pytrec-eval-terrier>=0.5.11",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "shap>=0.54.1",
    "torch>=2.14.1",
]

# sentence-transformers (C4 `scoring-ml`, C3 `rag`) runs pretrained models for
# inference only. Pin torch to the CPU-only wheels: the default Linux wheel pulls
# ~15 CUDA packages (several GB) that nothing here uses. See
# app/components/degradation_scoring/docs/decisions/C4-ADR-005.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py313"
# C4's old prototype, kept unchanged as a regression reference (C4-T11)
extend-exclude = ["tests/fixtures/degradation_scoring/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Strict typing is scoped to the degradation detection component (C3); extend `files` as C3
# adds modules to app/domain, app/infrastructure, app/shared, alembic and scripts. Shared folders
# are listed file by file because other components add their own (not strict-clean) modules.
[tool.mypy]
python_version = "3.13"
strict = true
files = [
    "app/components/degradation_detection",
    "app/components/degradation_scoring",
    "app/core/logging.py",
    "app/domain/audit_entry.py",
    "app/domain/boundary.py",
    "app/domain/canonical_release.py",
    "app/domain/degradation_event.py",
    "app/domain/release_package.py",
    "app/infrastructure/postgres/models/c3_release.py",
    "app/infrastructure/postgres/repositories/c3_release_repository.py",
    "app/shared",
    "alembic/versions/0001_c3_ingestion.py",
    "scripts/c3.py",
    # C4 adapters and migration
    "app/infrastructure/git/history.py",
    "app/infrastructure/postgres/models/c4_mining_cache.py",
    "app/infrastructure/postgres/repositories/mining_cache_repository.py",
    "alembic/versions/0002_c4_mining_cache.py",
]
# C4's old prototype, kept unchanged as a regression reference (C4-T11)
exclude = ["^tests/fixtures/degradation_scoring/legacy/"]

# Team modules that C3 files import but that are not strict-clean.
[[tool.mypy.overrides]]
module = ["app.core.config", "app.infrastructure.postgres.database"]
ignore_errors = true

# Libraries degradation scoring (C4) uses that ship no type information.
[[tool.mypy.overrides]]
module = [
    "faiss.*",
    "krippendorff.*",
    "lightgbm.*",
    "pydriller.*",
    "pymcdm.*",
    "pytrec_eval.*",
    "shap.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a database or the full pipeline",
    "llm: makes real LLM calls",
    "slow: long-running",
    "live: calls a real model provider. Deselected by default; needs a key in .env.",
]
addopts = "-m 'not live'"
