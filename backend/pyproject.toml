[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.2",
    "neo4j>=6.3.1",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0.54",
    "structlog>=26.1.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
cp = [
    "ruptures>=1.1.10",
]
rag = [
    "chromadb>=1.5.9",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.169.0",
    "mypy>=2.4.0",
    "pymannkendall>=1.4.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "scipy-stubs>=1.18.1.1",
    "statsmodels>=0.15.0",
    "types-jsonschema>=4.26.0.20261006",
    "types-networkx>=3.6.1.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Strict typing is scoped to the degradation detection component (C3); extend `files` as C3
# adds modules to app/domain, app/shared and scripts.
[tool.mypy]
python_version = "3.13"
strict = true
files = [
    "app/components/degradation_detection",
    "app/domain",
    "app/shared",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a database or the full pipeline",
    "llm: makes real LLM calls",
    "slow: long-running",
]
