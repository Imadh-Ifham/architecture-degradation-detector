// Cart service definitions
syntax = "proto3";

package cart.v1;

import "google/protobuf/empty.proto";

/* A shopping cart. */
message Cart {
  string id = 1;
  repeated string item_ids = 2;
}

message CartSummary {
  string id = 1;
  int32 item_count = 2;
}

enum CartStatus {
  CART_STATUS_UNSPECIFIED = 0;
  CART_STATUS_OPEN = 1;
}

service CartService {
  rpc GetCart (Cart) returns (Cart);
  rpc ListCarts (google.protobuf.Empty) returns (CartSummary);
  rpc Watch (Cart) returns (Cart);
}

service AdminService {
  rpc Purge (Cart) returns (CartSummary);
}

message NotAService {
  string note = 1;
}
