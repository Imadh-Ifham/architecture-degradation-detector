openapi: 3.0.0
info:
  title: Cart API
  version: 1.4.0
servers:
  - url: https://cart.example.com/api
    description: production
  - url: https://{tenant}.example.com/api
    description: templated
paths:
  /carts:
    get:
      operationId: listCarts
      tags: [cart]
      summary: List carts
      responses:
        '200':
          description: ok
    post:
      operationId: createCart
      tags: [cart]
      deprecated: true
      responses:
        '201':
          description: created
  /carts/{id}:
    parameters:
      - name: id
        in: path
        required: true
    delete:
      operationId: deleteCart
      responses:
        '204':
          description: deleted
