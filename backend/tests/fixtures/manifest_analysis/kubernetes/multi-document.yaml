apiVersion: v1
kind: ConfigMap
metadata:
  name: cart-config
  namespace: shop
data:
  LOG_LEVEL: debug
  DB_PASSWORD: configmap-secret-value
---
apiVersion: v1
kind: Secret
metadata:
  name: cart-secret
  namespace: shop
type: Opaque
data:
  password: c3VwZXJzZWNyZXQ=
  api_key: YWJjMTIz
stringData:
  inline: plaintext-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: shop
  labels:
    app.kubernetes.io/name: cart
spec:
  replicas: 2
  template:
    metadata:
      labels:
        app: cart
    spec:
      imagePullSecrets:
        - name: cart-secret
      containers:
        - name: cart
          image: gcr.io/example/cart:1.2.3
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: debug
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cart-secret
                  key: password
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: undeclared-secret
                  key: token
            - name: CONFIG_PATH
              valueFrom:
                configMapKeyRef:
                  name: cart-config
                  key: LOG_LEVEL
          envFrom:
            - configMapRef:
                name: cart-config
          volumeMounts:
            - name: config
              mountPath: /etc/config
      volumes:
        - name: config
          configMap:
            name: cart-config
        - name: data
          persistentVolumeClaim:
            claimName: cart-data
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: shop
spec:
  type: ClusterIP
  selector:
    app: cart
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: orphan
  namespace: shop
spec:
  selector:
    app: not-deployed-here
  ports:
    - port: 9000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cart-data
  namespace: shop
spec:
  accessModes: [ReadWriteOnce]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cart-sweeper
  namespace: shop
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: sweeper
              image: example/sweeper:2.0
              env:
                - name: SWEEP_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: cart-secret
                      key: api_key
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cart-ingress
  namespace: shop
spec:
  rules: []
