; Non-sensitive application configuration.
;
; This file is committed deliberately: it holds tuning values that are the same
; for every developer and every environment, so they do not belong in an
; environment file. Nothing here is a secret.
;
; Precedence, lowest to highest:
;   1. the defaults in app/core/config.py
;   2. this file
;   3. environment variables and backend/.env
;
; So anything here can still be overridden per machine or per deployment through
; the environment, which is what CI and containers should use.
;
; Secrets and environment-specific values (database hosts, credentials, ports,
; workspace paths) live in backend/.env and are never committed.

[app]
app_name = Architecture Degradation Detector

[git]
; Abandon a clone that makes no progress within this many seconds.
clone_timeout_seconds = 300

[inventory]
; The inventory walks a working tree without reading it; these bound that walk
; and the small number of manifests it does open.
max_files = 20000
max_file_size_bytes = 5000000
max_depth = 32
max_manifest_bytes = 262144
; Directory depth used when proposing a candidate component for a directory
; that holds code but declares no build manifest.
grouping_depth = 2
; Extra directory names to skip, comma-separated. Empty by default; the built-in
; exclusions (.git, node_modules, .venv, dist, ...) always apply.
extra_excluded_directories =

[manifest_analysis]
; Only files the inventory classified as a deployment manifest or an API
; specification are parsed, and only up to these limits.
manifest_max_bytes = 1048576
manifest_max_documents = 64

[validation]
; Which description of the observed architecture the validation component
; reads. "graph" reads recovery's own architecture store, which holds every
; release that has been analysed on this machine and is the live integration.
; "snapshot" reads a recorded recovery output from backend/data/snapshots and
; "inventory" reads recovery's repository_inventory.json; both only answer for
; a release somebody recorded, so they are the rehearsed fallback rather than
; the default. The choice is explicit and never a fallback at run time:
; whichever reader answered is stamped on the run's provenance, so a result
; always says which input made it.
architecture_source = graph

[scoring]
; Degradation scoring (C4); change one only with a
; decision record, because each run's manifest records what it used. The output
; directory is a path, so it is set in backend/.env (SCORING_OUTPUTS_ROOT) if at all.
scoring_seed = 42
; Ingestion : rank PENDING events too until C3 reviews them (C4-ADR-007); "A -> B" means
; "A depends on B" unless the upstream graph is reversed; confidence given to a
; path-prefix match.
scoring_rank_only_confirmed = false
scoring_graph_reverse_edges = false
scoring_resolution_prefix_confidence = 0.7
; Blast radius : equal feature weights; PageRank damping; betweenness is
; sampled with k pivots above this many nodes.
scoring_br_weight_fan_in_ratio = 0.25
scoring_br_weight_pagerank = 0.25
scoring_br_weight_betweenness = 0.25
scoring_br_weight_depth = 0.25
scoring_pagerank_alpha = 0.85
scoring_betweenness_exact_max_nodes = 5000
scoring_betweenness_sample_k = 500
; Evolutionary hotspot : half-life in releases (x median inter-release
; interval); co-change threshold theta; commits touching more files are bulk noise.
scoring_hotspot_half_life_releases = 2.0
scoring_cochange_threshold = 5
scoring_max_files_per_commit = 50
; Hotspot criterion = weighted mean of its normalised features; equal weights (C4-ADR-013).
scoring_eh_weight_churn_decayed = 0.25
scoring_eh_weight_authors = 0.25
scoring_eh_weight_coupling = 0.25
scoring_eh_weight_bugfix_ratio = 0.25
; Commit history (C4-T12): files kept for mining, comma-separated gitignore-style globs;
; excludes match at any depth (vendored, generated, test fixtures, build output).
scoring_history_include_globs = *.py,*.java,*.go,*.js,*.ts,*.cs,*.kt,*.rb,*.php,*.cpp,*.c,*.h
scoring_history_exclude_globs = **/vendor/**,**/node_modules/**,**/generated/**,**/*_pb2.py,**/*.pb.go,**/test*/fixtures/**,*.min.js,**/target/**,**/build/**,**/dist/**,**/bin/**,**/obj/**
; Persistence.
scoring_ps_weight_consecutive_releases = 0.7
scoring_ps_weight_growth_slope = 0.3
; ADR-violation weight: the semantic fallback is post-PP1 and off.
scoring_adr_semantic_fallback_enabled = false
scoring_adr_semantic_similarity_threshold = 0.6
; Normalisation and ranking .
scoring_winsor_lower_percentile = 5.0
scoring_winsor_upper_percentile = 95.0
scoring_small_n_threshold = 10
scoring_ahp_max_consistency_ratio = 0.10
scoring_weights_version = ahp_v1
scoring_method = topsis
scoring_topsis_mode = fixed_reference
; Explanation and audit.
scoring_explain_top_n = 10
scoring_retriever_top_k = 8
scoring_explanation_max_words = 120
scoring_llm_temperature = 0.0
scoring_nli_entailment_threshold = 0.5
scoring_nli_contradiction_threshold = 0.5
; Evaluation.
scoring_ground_truth_horizon_releases = 2
scoring_ground_truth_min_ops = 2
scoring_bootstrap_resamples = 1000
scoring_bootstrap_confidence = 0.95
scoring_random_baseline_permutations = 100
