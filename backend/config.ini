; Non-sensitive application configuration.
;
; This file is committed deliberately: it holds tuning values that are the same
; for every developer and every environment, so they do not belong in an
; environment file. Nothing here is a secret.
;
; Precedence, lowest to highest:
;   1. the defaults in app/core/config.py
;   2. this file
;   3. environment variables and backend/.env
;
; So anything here can still be overridden per machine or per deployment through
; the environment, which is what CI and containers should use.
;
; Secrets and environment-specific values (database hosts, credentials, ports,
; workspace paths) live in backend/.env and are never committed.

[app]
app_name = Architecture Degradation Detector

[git]
; Abandon a clone that makes no progress within this many seconds.
clone_timeout_seconds = 300

[inventory]
; The inventory walks a working tree without reading it; these bound that walk
; and the small number of manifests it does open.
max_files = 20000
max_file_size_bytes = 5000000
max_depth = 32
max_manifest_bytes = 262144
; Directory depth used when proposing a candidate component for a directory
; that holds code but declares no build manifest.
grouping_depth = 2
; Extra directory names to skip, comma-separated. Empty by default; the built-in
; exclusions (.git, node_modules, .venv, dist, ...) always apply.
extra_excluded_directories =

[manifest_analysis]
; Only files the inventory classified as a deployment manifest or an API
; specification are parsed, and only up to these limits.
manifest_max_bytes = 1048576
manifest_max_documents = 64

[validation]
; Which description of the observed architecture the validation component
; reads. "snapshot" reads a recorded recovery output from backend/data/snapshots,
; which the methodology prescribes while recovery's own dependency extraction is
; unfinished; "inventory" reads recovery's live repository_inventory.json.
; The choice is explicit and never a fallback: whichever reader answered is
; stamped on the run's provenance, so a result always says which input made it.
architecture_source = snapshot
